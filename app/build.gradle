android {
    namespace 'com.example.imagetocontact'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.imagetocontact"
        minSdk 24
        targetSdk 34
        versionCode 2          // Tăng dần số này lên (3, 4, 5...) ở mỗi lần cập nhật
        versionName "1.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}