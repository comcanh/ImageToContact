name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate Fixed Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -alias androiddebugkey -keypass android -keystore app/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK & Keystore
      uses: actions/upload-artifact@v4
      with:
        name: App-Output
        path: |
          app/build/outputs/apk/debug/*.apk
          app/debug.keystore