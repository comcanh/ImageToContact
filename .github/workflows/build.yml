name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Khóa cố định phiên bản Gradle 8.7
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    # Tạo khóa ký cố định vào thư mục hệ thống để mọi lần build đều dùng chung 1 chữ ký
    - name: Generate Fixed Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048 -noprompt
        cp ~/.android/debug.keystore app/debug.keystore
                   
    # Dùng trực tiếp lệnh gradle của hệ thống thay vì gọi ./gradlew
    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImageToContact-Debug-APK
        path: app/build/outputs/apk/debug/*.apk